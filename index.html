<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colour Randomiser</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 16px;
      background: white;
      color: #111;
      text-align: center;
    }

    .applet {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
    }

    .columns {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      align-items: start;
    }

    .column {
      min-width: 0;
    }

    .label {
      margin-bottom: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    .colour-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 2px solid #bbbbbb;
      border-radius: 12px;
      transition: background-color 0.18s ease, transform 0.18s ease;
    }

    .colour-box.pop {
      transform: scale(1.04);
    }

    select {
      display: block;
      width: 100%;
      min-height: 46px;
      margin-top: 16px;
      padding: 8px 10px;
      border: 1px solid #999999;
      border-radius: 10px;
      background: white;
      color: #111111;
      font-size: 16px;
      cursor: pointer;
    }

    #pressBtn {
      margin-top: 28px;
      min-width: 130px;
      min-height: 50px;
      padding: 12px 30px;
      border: 1px solid #888888;
      border-radius: 12px;
      background: #f3f3f3;
      color: #111111;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    #pressBtn:hover {
      background: #e8e8e8;
    }

    #pressBtn:active {
      transform: scale(0.98);
    }

    .note {
      margin-top: 14px;
      color: #555555;
      font-size: 14px;
      line-height: 1.4;
    }

    @media (max-width: 540px) {
      body {
        padding: 24px 10px;
      }

      .columns {
        gap: 10px;
      }

      .label {
        font-size: 16px;
      }

      select {
        padding: 8px 4px;
        font-size: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .colour-box {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="applet">
    <div class="columns" aria-live="polite">

      <div class="column">
        <div class="label">First</div>
        <div id="box1" class="colour-box" style="background:#facc15;" aria-label="First colour: Yellow"></div>

        <select id="colour1" aria-label="Choose first colour">
          <option value="yellow" selected>Yellow</option>
          <option value="pink">Pink</option>
          <option value="blue">Blue</option>
          <option value="green">Green</option>
          <option value="orange">Orange</option>
          <option value="purple">Purple</option>
          <option value="red">Red</option>
        </select>
      </div>

      <div class="column">
        <div class="label">Second</div>
        <div id="box2" class="colour-box" style="background:#5b168f;" aria-label="Second colour: Purple"></div>

        <select id="colour2" aria-label="Choose second colour">
          <option value="yellow">Yellow</option>
          <option value="pink">Pink</option>
          <option value="blue">Blue</option>
          <option value="green">Green</option>
          <option value="orange">Orange</option>
          <option value="purple" selected>Purple</option>
          <option value="red">Red</option>
        </select>
      </div>

      <div class="column">
        <div class="label">Third</div>
        <div id="box3" class="colour-box" style="background:#ff0000;" aria-label="Third colour: Red"></div>

        <select id="colour3" aria-label="Choose third colour">
          <option value="yellow">Yellow</option>
          <option value="pink">Pink</option>
          <option value="blue">Blue</option>
          <option value="green">Green</option>
          <option value="orange">Orange</option>
          <option value="purple">Purple</option>
          <option value="red" selected>Red</option>
        </select>
      </div>

    </div>

    <button id="pressBtn" type="button">Press</button>

    <div class="note">
      Choose any three colours, then press the button to shuffle them.
    </div>
  </main>

  <script>
    const boxes = [
      document.getElementById("box1"),
      document.getElementById("box2"),
      document.getElementById("box3")
    ];

    const selectors = [
      document.getElementById("colour1"),
      document.getElementById("colour2"),
      document.getElementById("colour3")
    ];

    const pressBtn = document.getElementById("pressBtn");

    const colourMap = {
      yellow: { name: "Yellow", value: "#facc15" },
      pink:   { name: "Pink",   value: "#ff69b4" },
      blue:   { name: "Blue",   value: "#2563eb" },
      green:  { name: "Green",  value: "#22c55e" },
      orange: { name: "Orange", value: "#f97316" },
      purple: { name: "Purple", value: "#5b168f" },
      red:    { name: "Red",    value: "#ff0000" }
    };

    function shuffle(items) {
      const result = [...items];

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }

      return result;
    }

    function getChosenColours() {
      return selectors.map(select => colourMap[select.value]);
    }

    function showColours(colours) {
      boxes.forEach((box, index) => {
        box.style.backgroundColor = colours[index].value;
        box.setAttribute("aria-label", `${index + 1}: ${colours[index].name}`);

        box.classList.remove("pop");
        void box.offsetWidth;
        box.classList.add("pop");
      });

      window.setTimeout(() => {
        boxes.forEach(box => box.classList.remove("pop"));
      }, 180);
    }

    function randomiseColours() {
      showColours(shuffle(getChosenColours()));
    }

    function showSelectedColours() {
      showColours(getChosenColours());
    }

    selectors.forEach(select => {
      select.addEventListener("change", showSelectedColours);
    });

    pressBtn.addEventListener("click", randomiseColours);

    showSelectedColours();
  </script>
</body>
</html>
