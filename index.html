<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colour Randomiser</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:40px 20px;background:#fff;text-align:center}
.labels,.boxes,.selectors{display:flex;justify-content:center;gap:20px}
.labels{margin-bottom:10px;font-weight:bold;font-size:20px}
.label,.colour-box,.selector-wrap{width:150px}
.colour-box{height:150px;border:1px solid #ccc;border-radius:12px;transition:background-color .18s ease,transform .18s ease}
.colour-box.pop{transform:scale(1.04)}
.selectors{margin-top:16px}
select{width:100%;min-height:44px;padding:8px 10px;font-size:16px;border:1px solid #aaa;border-radius:10px;background:#fff;cursor:pointer}
button{margin-top:28px;padding:14px 38px;font-size:20px;font-weight:bold;border:1px solid #888;border-radius:12px;cursor:pointer;background:#f3f3f3}
button:active{transform:scale(.98)}
.note{margin-top:12px;color:#555;font-size:14px}
@media(max-width:540px){
.labels,.boxes,.selectors{gap:10px}
.label,.colour-box,.selector-wrap{width:28vw;max-width:120px}
.colour-box{height:28vw;max-height:120px}
.labels{font-size:16px}
select{font-size:15px;padding:7px 6px}
}
@media(prefers-reduced-motion:reduce){.colour-box{transition:none}}
</style>
</head>
<body>
<div class="labels">
  <div class="label">First</div>
  <div class="label">Second</div>
  <div class="label">Third</div>
</div>

<div class="boxes" aria-live="polite">
  <div class="colour-box"></div>
  <div class="colour-box"></div>
  <div class="colour-box"></div>
</div>

<div class="selectors">
  <div class="selector-wrap">
    <select id="colour1" aria-label="Choose first colour">
      <option value="yellow" selected>Yellow</option>
      <option value="pink">Pink</option>
      <option value="blue">Blue</option>
      <option value="green">Green</option>
      <option value="orange">Orange</option>
      <option value="purple">Purple</option>
      <option value="red">Red</option>
    </select>
  </div>
  <div class="selector-wrap">
    <select id="colour2" aria-label="Choose second colour">
      <option value="yellow">Yellow</option>
      <option value="pink">Pink</option>
      <option value="blue">Blue</option>
      <option value="green">Green</option>
      <option value="orange">Orange</option>
      <option value="purple" selected>Purple</option>
      <option value="red">Red</option>
    </select>
  </div>
  <div class="selector-wrap">
    <select id="colour3" aria-label="Choose third colour">
      <option value="yellow">Yellow</option>
      <option value="pink">Pink</option>
      <option value="blue">Blue</option>
      <option value="green">Green</option>
      <option value="orange">Orange</option>
      <option value="purple">Purple</option>
      <option value="red" selected>Red</option>
    </select>
  </div>
</div>

<button id="pressBtn" type="button">Press</button>
<div class="note">Choose any three colours, then press the button to shuffle them.</div>

<script>
const boxes=document.querySelectorAll('.colour-box');
const pressBtn=document.getElementById('pressBtn');
const selectors=[
  document.getElementById('colour1'),
  document.getElementById('colour2'),
  document.getElementById('colour3')
];

const colourMap={
  yellow:{name:'Yellow',value:'#facc15'},
  pink:{name:'Pink',value:'#ff69b4'},
  blue:{name:'Blue',value:'#2563eb'},
  green:{name:'Green',value:'#22c55e'},
  orange:{name:'Orange',value:'#f97316'},
  purple:{name:'Purple',value:'#5b168f'},
  red:{name:'Red',value:'#ff0000'}
};

function shuffle(items){
  const result=[...items];
  for(let i=result.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }
  return result;
}

function getSelectedColours(){
  return selectors.map(select=>colourMap[select.value]);
}

function randomiseColours(){
  const shuffled=shuffle(getSelectedColours());
  boxes.forEach((box,index)=>{
    box.style.backgroundColor=shuffled[index].value;
    box.setAttribute('aria-label',shuffled[index].name);
    box.classList.remove('pop');
    void box.offsetWidth;
    box.classList.add('pop');
  });
  setTimeout(()=>boxes.forEach(box=>box.classList.remove('pop')),180);
}

selectors.forEach(select=>select.addEventListener('change',randomiseColours));
pressBtn.addEventListener('click',randomiseColours);
randomiseColours();
</script>
</body>
</html>
